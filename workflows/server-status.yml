name: Update Deadside Server Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GameDig
        run: npm install gamedig

      - name: Query Server
        run: node .github/workflows/query-server.js

      - name: Show JSON
        run: |
          echo "============================"
          echo "SERVER STATUS JSON"
          echo "============================"
          cat server-status.json

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server-status.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Deadside server status"
            git push origin main
          fi